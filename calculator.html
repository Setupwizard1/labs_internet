<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <!-- Пиксельный шрифт с поддержкой кириллицы -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Хаб сверху -->
  <header class="hub">
    <nav class="hub-nav">
      <button type="button" class="my-btn hub-btn">Игра</button>
      <button type="button" class="my-btn hub-btn">Саундтрек</button>
      <button type="button" class="my-btn hub-btn">Мерч</button>
      <button type="button" class="my-btn hub-btn">FAQ</button>
    </nav>
  </header>

  <main class="page">

    <!-- Логотип игры -->
    <img class="logo" src="logo.png" alt="DELTARUNE">

    <!-- Задание 19: цель ЛР с подсветкой слов тегом <mark> -->
    <p class="goal">
      <b>Цель ЛР:</b> <mark>знакомство</mark> с инструментами построения
      интерфейсов: <mark>HTML</mark> и <mark>CSS</mark>.
    </p>

    <!-- Задание 18: сворачивающиеся подробности -->
    <details class="author">
      <summary>Автор</summary>
      <p>ФИО: Сергеева М.А.</p>
      <p>Группа: ИБМ3-54Б</p>
    </details>

    <div class="calc">

      <!-- экран калькулятора -->
      <div id="result" class="result">0</div>

      <!-- кнопки калькулятора -->
      <div class="keys">
        <button id="btn_op_clear" class="my-btn secondary">C</button>
        <button id="btn_op_sign" class="my-btn secondary">+/-</button>
        <button id="btn_op_percent" class="my-btn secondary">%</button>
        <button id="btn_op_div" class="my-btn primary">/</button>

        <button id="btn_digit_7" class="my-btn">7</button>
        <button id="btn_digit_8" class="my-btn">8</button>
        <button id="btn_digit_9" class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn primary">x</button>

        <button id="btn_digit_4" class="my-btn">4</button>
        <button id="btn_digit_5" class="my-btn">5</button>
        <button id="btn_digit_6" class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn primary">-</button>

        <button id="btn_digit_1" class="my-btn">1</button>
        <button id="btn_digit_2" class="my-btn">2</button>
        <button id="btn_digit_3" class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn primary">+</button>

        <button id="btn_digit_0" class="my-btn">0</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn primary execute">=</button>
      </div>

      <!-- Задания 12 и 16: смена фона и ссылка на GitHub -->
      <div class="tools">
        <button type="button" class="my-btn tool"
                onclick="document.body.classList.toggle('alt')">Тема</button>
        <a class="my-btn tool link" href="https://github.com/Setupwizard1"
           target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>

    <!-- Задание 9: надпись внизу -->
    <p class="footer">by setupwizard</p>
  </main>

  <script>
    // ===== Логика калькулятора =====
    const screen = document.getElementById('result');
    const MAX_DIGITS = 12;

    let cur = '0';      // число на экране (строка)
    let prev = null;    // первый операнд
    let op = null;      // текущая операция: '+', '-', '*', '/'
    let fresh = false;  // true — следующая цифра начинает новое число

    const opButtons = {
      '+': document.getElementById('btn_op_plus'),
      '-': document.getElementById('btn_op_minus'),
      '*': document.getElementById('btn_op_mult'),
      '/': document.getElementById('btn_op_div')
    };

    const isError = () => cur === 'Ошибка';

    function render() {
      screen.textContent = cur;
      // чем длиннее число, тем мельче шрифт, чтобы оно помещалось
      screen.classList.toggle('small', cur.length > 9);
      for (const key in opButtons) {
        opButtons[key].classList.toggle('active', op === key && fresh);
      }
    }

    // убираем «хвосты» вида 0.1+0.2 = 0.30000000000000004
    function format(n) {
      if (!isFinite(n)) return 'Ошибка';
      let s = String(parseFloat(n.toPrecision(12)));
      if (s.length > MAX_DIGITS + 1) s = n.toExponential(5);
      return s;
    }

    function compute(a, b, o) {
      switch (o) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
      }
      return b;
    }

    function inputDigit(d) {
      if (isError()) clearAll();
      if (fresh) { cur = '0'; fresh = false; }
      if (cur === '0') cur = d;
      else if (cur.replace(/[-.]/g, '').length < MAX_DIGITS) cur += d;
      render();
    }

    function inputDot() {
      if (isError()) clearAll();
      if (fresh) { cur = '0'; fresh = false; }
      if (!cur.includes('.')) cur += '.';
      render();
    }

    function setOp(o) {
      if (isError()) return;
      if (op !== null && !fresh) {          // цепочка: 2 + 3 + ...
        cur = format(compute(prev, parseFloat(cur), op));
        if (isError()) { prev = null; op = null; fresh = true; render(); return; }
      }
      prev = parseFloat(cur);
      op = o;
      fresh = true;
      render();
    }

    function equals() {
      if (isError() || op === null) return;
      cur = format(compute(prev, parseFloat(cur), op));
      prev = null;
      op = null;
      fresh = true;
      render();
    }

    function clearAll() {
      cur = '0'; prev = null; op = null; fresh = false;
      render();
    }

    function toggleSign() {
      if (isError() || cur === '0') return;
      cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
      render();
    }

    function percent() {
      if (isError()) return;
      cur = format(parseFloat(cur) / 100);
      fresh = true;
      render();
    }

    function backspace() {
      if (isError() || fresh) return;
      cur = cur.length > 1 && cur !== '-0' ? cur.slice(0, -1) : '0';
      if (cur === '-') cur = '0';
      render();
    }

    // ===== Привязка кнопок =====
    for (let i = 0; i <= 9; i++) {
      document.getElementById('btn_digit_' + i)
        .addEventListener('click', () => inputDigit(String(i)));
    }
    document.getElementById('btn_digit_dot').addEventListener('click', inputDot);
    document.getElementById('btn_op_plus').addEventListener('click', () => setOp('+'));
    document.getElementById('btn_op_minus').addEventListener('click', () => setOp('-'));
    document.getElementById('btn_op_mult').addEventListener('click', () => setOp('*'));
    document.getElementById('btn_op_div').addEventListener('click', () => setOp('/'));
    document.getElementById('btn_op_equal').addEventListener('click', equals);
    document.getElementById('btn_op_clear').addEventListener('click', clearAll);
    document.getElementById('btn_op_sign').addEventListener('click', toggleSign);
    document.getElementById('btn_op_percent').addEventListener('click', percent);

    // после клика снимаем фокус, чтобы Enter не «нажимал» кнопку повторно
    document.querySelectorAll('.keys .my-btn').forEach(b =>
      b.addEventListener('click', () => b.blur()));

    // ===== Управление с клавиатуры =====
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) inputDigit(k);
      else if (k === '.' || k === ',') inputDot();
      else if (k === '+' || k === '-' || k === '/') setOp(k);
      else if (k === '*' || k === 'x' || k === 'X') setOp('*');
      else if (k === 'Enter' || k === '=') equals();
      else if (k === 'Backspace') backspace();
      else if (k === 'Escape' || k === 'c' || k === 'C') clearAll();
      else if (k === '%') percent();
      else return;
      e.preventDefault();
    });

    render();
  </script>
</body>

</html>
